<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#3B82F6" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="#8B5CF6" opacity="0.1"/>
  
  <!-- Content -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Tonguino Gaston Pascal</text>
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="36" fill="#94A3B8" text-anchor="middle">Software Engineer Student</text>
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="28" fill="#64748B" text-anchor="middle">Full-Stack Developer | Mobile Apps | Real-Time Systems</text>
  
  <!-- Bottom accent line -->
  <rect x="400" y="500" width="400" height="4" fill="url(#textGrad)" rx="2"/>
</svg>
